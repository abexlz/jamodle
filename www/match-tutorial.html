<!DOCTYPE html>
<html lang="ko">
<head>
<script>
(function(){
  try {
    var p = JSON.parse(localStorage.getItem('jamodeul-preferences') || '{}');
    var theme = p.theme || localStorage.getItem('jamodeul-theme') || 'system';
    var resolved = theme;
    if (theme === 'system' || (theme !== 'light' && theme !== 'dark')) {
      resolved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', resolved);
    if (p.reduceMotion) document.documentElement.classList.add('reduce-motion');
    document.documentElement.lang = p.language === 'ko' ? 'ko' : 'en';
    document.documentElement.setAttribute('data-font-pack', p.devFontPack === 'jua' ? 'jua' : 'junegull');
  } catch (e) {}
})();
</script>

<script>
(async function () {
  await AppBootstrap?.bootstrap?.();
  I18n?.init?.();
  ProfileService?.loadProfile?.();
  const params = new URLSearchParams(location.search);
  const start = params.get('start') === '1';
  const replay = params.get('replay') === '1';
  if (!start && !replay) {
    location.replace('index.html');
    return;
  }
  new MatchTutorialApp().mount();
  // Same home-nav shell as Hangul-dle match pages
  window.HomeNav?.mountGamePage?.({
    href: (location.pathname.split('/').pop() || 'match-tutorial.html') + (location.search || ''),
    type: 'page',
  });
})();
</script>
